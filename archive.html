(function(){
 var ptr=document.getElementById('ptr'); if(!ptr)return;
 var ring=ptr.querySelector('.ring'), arrow=ring.querySelector('svg');
 var startY=0,pulling=false,dist=0,busy=false;
 var MAX=92,TRIG=62;
 function draw(d){
  ring.style.transform='translateY('+(Math.min(d,MAX)-42)+'px)';
  ring.style.opacity=Math.min(1,d/26);
  arrow.style.transform='rotate('+(Math.min(1,d/TRIG)*180)+'deg)';
 }
 function reset(){
  ring.style.transition='transform .25s ease,opacity .25s ease';
  ring.style.transform='translateY(-42px)';ring.style.opacity=0;
  setTimeout(function(){ring.style.transition='';},280);
 }
 document.addEventListener('touchstart',function(e){
  if(busy||window.scrollY>0||e.touches.length!==1){pulling=false;return;}
  startY=e.touches[0].clientY;pulling=true;dist=0;ring.style.transition='';
 },{passive:true});
 document.addEventListener('touchmove',function(e){
  if(!pulling)return;
  var dy=e.touches[0].clientY-startY;
  if(dy<=0||window.scrollY>0){pulling=false;reset();return;}
  e.preventDefault();
  dist=dy*0.5;draw(dist);
 },{passive:false});
 document.addEventListener('touchend',function(){
  if(!pulling)return;pulling=false;
  if(dist<TRIG){reset();return;}
  busy=true;
  ring.style.transition='transform .18s ease';
  ring.style.transform='translateY(16px)';ring.style.opacity=1;
  ring.classList.add('spin');
  try{sessionStorage.setItem('hb_refreshed','1');}catch(_){}
  var done=false,go=function(){if(!done){done=true;location.reload();}};
  fetch(location.href,{cache:'reload'}).then(go,go);
  setTimeout(go,2500);
 },{passive:true});
 try{
  if(sessionStorage.getItem('hb_refreshed')){
   sessionStorage.removeItem('hb_refreshed');
   var t=document.getElementById('toast');
   t.textContent='최신 내용입니다 · 업데이트 08월 06일 17:05';
   requestAnimationFrame(function(){t.classList.add('on');});
   setTimeout(function(){t.classList.remove('on');},2400);
  }
 }catch(_){}
})();
</script></div></body></html>
